name: Build APK

on:
  push:
    branches: [flutter-base]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generar carpeta android
        run: |
          flutter create --platforms=android --project-name app_mascotas .
          rm -f test/widget_test.dart

      - name: Ajustes Android para notificaciones
        run: |
          python3 - <<'EOF'
          import re, pathlib

          perm = '<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>'
          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text(encoding='utf-8')
          if perm not in s:
              s = re.sub(r'(<manifest[^>]*>)', lambda m: m.group(1) + '\n    ' + perm, s, count=1)
              manifest.write_text(s, encoding='utf-8')

          desugar = 'com.android.tools:desugar_jdk_libs:2.1.4'
          kts = pathlib.Path('android/app/build.gradle.kts')
          gvy = pathlib.Path('android/app/build.gradle')
          if kts.exists():
              s = kts.read_text(encoding='utf-8')
              if 'isCoreLibraryDesugaringEnabled' not in s:
                  s = re.sub(r'(compileOptions\s*\{)', lambda m: m.group(1) + '\n        isCoreLibraryDesugaringEnabled = true', s, count=1)
                  s += '\ndependencies {\n    coreLibraryDesugaring("' + desugar + '")\n}\n'
                  kts.write_text(s, encoding='utf-8')
          elif gvy.exists():
              s = gvy.read_text(encoding='utf-8')
              if 'coreLibraryDesugaringEnabled' not in s:
                  s = re.sub(r'(compileOptions\s*\{)', lambda m: m.group(1) + '\n        coreLibraryDesugaringEnabled true', s, count=1)
                  s += '\ndependencies {\n    coreLibraryDesugaring "' + desugar + '"\n}\n'
                  gvy.write_text(s, encoding='utf-8')
          EOF

      - name: Marca KoinuCare (nombre e identificador)
        run: |
          python3 - <<'EOF'
          import pathlib, re

          manifest = pathlib.Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text(encoding='utf-8')
          s = re.sub(r'android:label="[^"]*"', 'android:label="KoinuCare"', s, count=1)
          manifest.write_text(s, encoding='utf-8')

          for name in ['android/app/build.gradle.kts', 'android/app/build.gradle']:
              p = pathlib.Path(name)
              if p.exists():
                  s = p.read_text(encoding='utf-8')
                  s = re.sub(r'applicationId\s*=?\s*"[^"]*"', lambda m: m.group(0).split('"')[0] + '"com.koinucare.app"', s, count=1)
                  p.write_text(s, encoding='utf-8')
          EOF

      - name: Dependencias
        run: flutter pub get

      - name: Generar íconos de KoinuCare
        run: dart run flutter_launcher_icons

      - name: Generar código de drift
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Pruebas
        run: flutter test

      - name: Compilar APK
        run: flutter build apk --release

      - name: Nombrar APK
        run: cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/KoinuCare.apk

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: KoinuCare ${{ github.run_number }}
          files: build/app/outputs/flutter-apk/KoinuCare.apk
